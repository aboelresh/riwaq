version: '3.8'

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: Riwaq-app
    container_name: Riwaq_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - Riwaq

  nginx:
    image: nginx:alpine
    container_name: Riwaq_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - Riwaq

  db:
    image: mysql:8.4
    container_name: Riwaq_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    ports:
      - "3306:3306"
    networks:
      - Riwaq

  redis:
    image: redis:7-alpine
    container_name: Riwaq_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    networks:
      - Riwaq

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Riwaq_queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --tries=3 --backoff=60 --timeout=300
    volumes:
      - ./:/var/www
    depends_on:
      - app
      - db
      - redis
    networks:
      - Riwaq

networks:
  Riwaq:
    driver: bridge

volumes:
  dbdata:
    driver: local
  redisdata:
    driver: local